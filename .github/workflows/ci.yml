
name: Voting App Microservices CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voting-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # ====================================
  # 1. APPLICATION TESTS
  # ====================================

  test:
    runs-on: [self-hosted, linux, x64, voting-runner]

    strategy:
      fail-fast: false
      matrix:
        service: [vote, result]

    steps:
      - uses: actions/checkout@v4

      - name: Test ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -e

          if [ "$SERVICE" = "vote" ]; then
            python3 -m venv .venv-vote
            . .venv-vote/bin/activate
            pip install -r vote/requirements.txt
            python3 -m compileall -q vote

            if [ -d vote/tests ]; then
              pip install pytest
              python3 -m pytest -q vote/tests
            fi

          elif [ "$SERVICE" = "result" ]; then
            cd result

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            node --check server.js

            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              npm test
            fi
          fi

  # ====================================
  # 2. .NET WORKER BUILD
  # ====================================

  worker-build:
    runs-on: [self-hosted, linux, x64, voting-runner]

    steps:
      - uses: actions/checkout@v4

      - name: Build Worker
        run: |
          docker build \
            -t voting-worker:ci-${GITHUB_SHA::12} \
            ./worker

  # ====================================
  # 3. GITLEAKS SECRET SCAN
  # ====================================

  gitleaks:
    runs-on: [self-hosted, linux, x64, voting-runner]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================================
  # 4. SONARQUBE
  # ====================================

  sonar:
    runs-on: [self-hosted, linux, x64, voting-runner]

    needs: [test, worker-build, gitleaks]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ====================================
  # 5. BUILD + TRIVY + DOCKER HUB PUSH
  # ====================================

  build-push:
    runs-on: [self-hosted, linux, x64, voting-runner]

    needs: sonar

    strategy:
      fail-fast: false
      matrix:
        component: [vote, result, worker]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Hub username
        run: |
          test -n "$DOCKERHUB_USERNAME"

      - name: Docker Hub Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          TAG="${GITHUB_SHA::12}"

          IMAGE="${DOCKERHUB_USERNAME}/voting-${COMPONENT}:${TAG}"

          docker build \
            -t "$IMAGE" \
            "./${COMPONENT}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Trivy vulnerability scan
        run: |
          trivy image \
            --scanners vuln \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "$IMAGE"

      - name: Push Docker image
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"

      - name: Logout Docker Hub
        if: always()
        run: docker logout || true

  # ====================================
  # 6. GITOPS UPDATE
  # ====================================

  gitops-update:
    runs-on: [self-hosted, linux, x64, voting-runner]

    needs: build-push

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Update Kubernetes manifest image tags
        env:
          TAG: ${{ github.sha }}
        run: |
          set -e
          SHORT_TAG="${TAG:0:12}"
          export SHORT_TAG

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path("k8s")
          user = os.environ["DOCKERHUB_USERNAME"]
          tag = os.environ["SHORT_TAG"]

          if not root.is_dir():
              raise SystemExit(
                  "ERROR: k8s directory missing"
              )

          components = ("vote", "result", "worker")
          counts = {name: 0 for name in components}

          paths = sorted(
              list(root.rglob("*.yaml")) +
              list(root.rglob("*.yml"))
          )

          for path in paths:
              original = path.read_text()
              lines = original.splitlines(keepends=True)
              updated = []

              for line in lines:
                  match = re.match(
                      r'^(\s*(?:-\s*)?image:\s*)(["\']?)([^\s"\']+)(["\']?)(.*)$',
                      line
                  )

                  if not match:
                      updated.append(line)
                      continue

                  prefix, q1, old, q2, rest = match.groups()

                  image_name = old.rsplit("/", 1)[-1]
                  image_name = re.split(
                      r"[:@]", image_name, maxsplit=1
                  )[0]

                  component = next(
                      (
                          c for c in components
                          if image_name == f"voting-{c}"
                      ),
                      None
                  )

                  if component is None:
                      updated.append(line)
                      continue

                  new_image = (
                      f"{user}/voting-{component}:{tag}"
                  )

                  updated.append(
                      f"{prefix}{q1}{new_image}{q2}{rest}"
                  )
                  counts[component] += 1

              new_content = "".join(updated)

              if new_content != original:
                  path.write_text(new_content)
                  print(f"Updated {path}")

          print("Image matches:", counts)

          missing = [
              c for c in components if counts[c] == 0
          ]

          if missing:
              raise SystemExit(
                  "ERROR: No matching image for: "
                  + ", ".join(missing)
                  + ". Check deployment manifests."
              )
          PY

      - name: Verify manifest changes
        run: |
          git diff --check
          git diff -- k8s/

      - name: Commit Kubernetes GitOps changes
        run: |
          git config user.name "voting-ci[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m \
            "ci: update voting images ${GITHUB_SHA::12} [skip ci]"

          git push origin HEAD:main

