deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: voting-loki-chunks-263860684319-eu-north-1
      ruler: voting-loki-ruler-263860684319-eu-north-1
    s3:
      region: eu-north-1

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

  compactor:
    retention_enabled: true
    delete_request_store: s3

serviceAccount:
  create: false
  name: loki

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: voting-gp3
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

minio:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false
