apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting
spec:
  replicas: 2
  selector:
    matchLabels: {app: vote}
  template:
    metadata:
      labels: {app: vote}
    spec:
      containers:
        - name: vote
          image: harathi2026/voting-vote:3bbe672cd678
          ports: [{containerPort: 80}]
          env:
            - {name: REDIS_HOST, value: redis}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting
spec:
  type: ClusterIP
  selector: {app: vote}
  ports: [{port: 80, targetPort: 80}]
