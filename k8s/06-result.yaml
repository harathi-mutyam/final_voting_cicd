apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: harathi2026/voting-result:3bbe672cd678
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
            - name: REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: voting
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  selector:
    app: result
  ports:
    - port: 80
      targetPort: 80
