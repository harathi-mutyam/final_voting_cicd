apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-gateway
  namespace: voting
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting
spec:
  parentRefs:
    - name: voting-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /vote
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: vote
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: vote
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vote
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting
spec:
  parentRefs:
    - name: voting-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /result
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: result
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /stylesheets
        - path:
            type: Exact
            value: /socket.io.js
        - path:
            type: Exact
            value: /angular.min.js
        - path:
            type: Exact
            value: /app.js
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: result
          port: 80
