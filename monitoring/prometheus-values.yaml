prometheus:
  prometheusSpec:
    retention: 2d
    replicas: 1
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: {cpu: 100m, memory: 350Mi}
      limits: {memory: 1Gi}
grafana:
  enabled: true
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 50m, memory: 100Mi}
      limits: {memory: 256Mi}
